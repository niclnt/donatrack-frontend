spring.application.name=donatrack-frontend
# 8081 lo usa notificaciones-service
server.port=8086

# Sesion del navegador con el front; los tokens del auth-service se guardan en ella
server.servlet.session.timeout=30m

# Servicios que consume el front (cada servicio agrega su URL aca)
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8084/api/auth}
donaciones.service.url=${DONACIONES_SERVICE_URL:http://localhost:8080}
logistica.service.url=${LOGISTICA_SERVICE_URL:http://localhost:8083}

# Importacion CSV: el de 20k filas pesa ~1,7 MB y el default de Spring es 1 MB (igual que donaciones-service)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# En desarrollo, ver los cambios de las plantillas sin reiniciar
spring.thymeleaf.cache=false
notificaciones.service.url=http://localhost:8081
incentivos.service.url=${INCENTIVOS_SERVICE_URL:http://localhost:8082}
# Actuator: /actuator/health (publico, sin detalles) + /liveness y /readiness para los healthchecks
management.endpoint.health.probes.enabled=true

# Observabilidad: endpoints expuestos y metricas para Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
# Tag comun a todas las metricas, para filtrar por servicio en Grafana
management.metrics.tags.application=${spring.application.name}
# Histograma de latencias de los requests HTTP (para calcular p95/p99 en Grafana)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Rate limiting (Token Bucket). General: por usuario logueado o por IP. Login: por IP, contra fuerza bruta.
# capacidad = rafaga maxima; solicitudes-por-minuto = promedio sostenido. Estaticos y actuator no se limitan.
ratelimit.habilitado=${RATELIMIT_HABILITADO:true}
ratelimit.capacidad=${RATELIMIT_FRONT_CAPACIDAD:60}
ratelimit.solicitudes-por-minuto=${RATELIMIT_FRONT_SOLICITUDES_POR_MINUTO:120}
ratelimit.login.capacidad=${RATELIMIT_LOGIN_CAPACIDAD:5}
ratelimit.login.solicitudes-por-minuto=${RATELIMIT_LOGIN_SOLICITUDES_POR_MINUTO:5}

# Trazas distribuidas: se guarda el 100% de los requests y se mandan a Zipkin
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
