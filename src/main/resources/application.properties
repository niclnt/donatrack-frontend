spring.application.name=donatrack-frontend
# 8081 lo usa notificaciones-service
server.port=8086

# Sesion del navegador con el front; los tokens del auth-service se guardan en ella
server.servlet.session.timeout=30m

# Servicios que consume el front (cada servicio agrega su URL aca)
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8084/api/auth}
donaciones.service.url=${DONACIONES_SERVICE_URL:http://localhost:8080}
logistica.service.url=${LOGISTICA_SERVICE_URL:http://localhost:8083}

# Importacion CSV: el de 20k filas pesa ~1,7 MB y el default de Spring es 1 MB (igual que donaciones-service)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# En desarrollo, ver los cambios de las plantillas sin reiniciar
spring.thymeleaf.cache=false
notificaciones.service.url=http://localhost:8081
incentivos.service.url=${INCENTIVOS_SERVICE_URL:http://localhost:8082}