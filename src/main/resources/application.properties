spring.application.name=donatrack-frontend
# 8081 lo usa notificaciones-service
server.port=8085

# Sesion del navegador con el front; los tokens del auth-service se guardan en ella
server.servlet.session.timeout=30m

# Servicios que consume el front (cada servicio agrega su URL aca)
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8084/api/auth}
donaciones.service.url=${DONACIONES_SERVICE_URL:http://localhost:8080}

# En desarrollo, ver los cambios de las plantillas sin reiniciar
spring.thymeleaf.cache=false
