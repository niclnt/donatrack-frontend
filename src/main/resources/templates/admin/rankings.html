<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Rankings — DonaTrack')}"></head>
<body>
<a class="skip-link" href="#main">Saltar al contenido</a>

<div class="page">
    <header th:replace="~{fragments/base :: topbarAdmin}"></header>

    <div class="shell">
        <aside th:replace="~{fragments/base :: sidebarAdmin('rankings')}"></aside>

        <main id="main" class="shell__main">
            <div class="container" style="max-width: 1180px;">
                <div class="page-head">
                    <div>
                        <h1>Ranking mensual de donantes</h1>
                        <!-- <p class="page-head__sub">Visualizá los donantes más activos del mes actual.</p> -->
                    </div>
                    <div class="flex gap-2 wrap">
                        <!-- Historial: ranking guardado de cada mes (requerimiento 19) -->
                        <form th:if="${periodos != null and !periodos.isEmpty()}" th:action="@{/admin/rankings}" method="get"
                              class="flex gap-2" style="display: inline-flex; align-items: center;">
                            <label for="periodo" class="sr-only">Mes del ranking</label>
                            <select class="select" id="periodo" name="periodo" style="width: auto; min-width: 180px;"
                                    onchange="this.form.submit()">
                                <option th:each="p : ${periodos}" th:value="${p.key}" th:text="${p.value}"
                                        th:selected="${p.key == periodoSeleccionado}">Noviembre 2026</option>
                            </select>
                            <noscript><button class="btn btn--ghost btn--sm" type="submit">Ver</button></noscript>
                        </form>
                        <!-- Ranking a demanda: el mismo calculo que el cierre de mes programado -->
                        <form th:action="@{/admin/rankings/generar}" method="post" data-loading style="display: inline;">
                            <button class="btn btn--primary btn--sm" type="submit">Generar ranking ahora</button>
                        </form>
                    </div>
                </div>

                <div th:if="${exitoRanking}" class="alert alert--success mt-4" th:text="${exitoRanking}"></div>
                <div th:if="${errorRanking}" class="alert alert--error mt-4" role="alert" th:text="${errorRanking}"></div>

                <section class="card mt-5" aria-labelledby="ranking-title">
                    <div class="card__header">
                        <div>
                            <h2 id="ranking-title" th:text="${nombrePeriodo != null} ? 'Top donantes de ' + ${nombrePeriodo} : 'Top donantes del mes'">Top donantes del mes</h2>
                            <p class="muted" style="font-size: var(--fs-sm);">Calculado por actividad general durante el período.</p>
                        </div>
                        <span class="badge badge--success">Top Destacado</span>
                    </div>
                    <div class="table-wrap">
                        <table class="table">
                            <caption class="sr-only">Ranking mensual de donantes</caption>
                            <thead>
                            <tr>
                                <th scope="col">Puesto</th>
                                <th scope="col">Donante</th>
                                <th scope="col">Misiones cumplidas</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- Bucle de Thymeleaf iterando sobre objetos PuestoDTO -->
                            <tr th:each="puesto : ${rankingMensual}">

                                <!-- Usamos directamente el 'puesto' que viene del backend -->
                                <td><strong th:text="'#' + ${puesto.puesto()}">#1</strong></td>

                                <td th:text="${puesto.username()}">Nombre Donante</td>

                                <!-- Usamos el nuevo nombre del atributo -->
                                <td class="num" th:text="${puesto.cantidadMisionesCompletadas()}">8</td>
                            </tr>

                            <!-- Fila de respaldo si la tabla viene vacía -->
                            <tr th:if="${rankingMensual == null or rankingMensual.isEmpty()}">
                                <td colspan="3" class="muted" style="text-align: center; padding: 20px;">Todavía no hay datos suficientes para el ranking de este mes.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </main>
    </div>
</div>

<script th:src="@{/assets/js/app.js}"></script>
</body>
</html>
