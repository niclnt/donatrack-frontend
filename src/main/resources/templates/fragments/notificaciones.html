<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="lista(error, notificaciones)">
    <!-- Manejo de errores -->
    <div th:if="${error != null}" class="alert alert--error" role="alert" style="margin-bottom: 20px;">
        <p th:text="${error}">Mensaje de error</p>
    </div>

    <!-- Estado vacío -->
    <div th:if="${error == null and (notificaciones == null or notificaciones.isEmpty())}" class="empty-state card" style="margin-bottom: var(--sp-6);">
        <div class="empty-state__icon">🔔</div>
        <h3>No tienes notificaciones</h3>
        <p>Las actualizaciones sobre tus donaciones y logros aparecerán aquí.</p>
    </div>

    <!-- Lista de notificaciones -->
    <div th:if="${notificaciones != null and !notificaciones.isEmpty()}" class="grid" style="gap: var(--sp-3); margin-bottom: var(--sp-6);">
        <article th:each="notif : ${notificaciones}" class="card">
            <div class="flex items-center justify-between gap-3" style="margin-bottom: var(--sp-3);">
                <div class="flex items-center gap-3">
                    <!-- Icono dinámico según el medio de envío -->
                    <div class="entity__icon" style="background: var(--primary-weak); color: var(--primary);" aria-hidden="true" th:text="${notif.medio == 'EMAIL' ? '✉️' : ((notif.medio == 'TELEFONO' || notif.medio == 'WHATSAPP') ? '📱' : '📦')}">📦</div>
                    <span class="badge" th:if="${notif.medio != null}" th:text="${notif.medio}">EMAIL</span>
                </div>
                <span class="badge"
                      th:classappend="${notif.estado == 'ENVIADA' ? 'badge--success' : (notif.estado == 'FALLIDA' ? 'badge--danger' : 'badge--warning')}"
                      th:text="${@estados.texto(notif.estado)}">ENVIADA</span>
            </div>

            <strong style="display: block; margin-bottom: 4px;" th:text="${notif.titulo}">Título Notificación</strong>
            <p class="muted" style="font-size: var(--fs-sm); margin: 0 0 8px 0;" th:text="${notif.mensaje}">Mensaje descriptivo...</p>
            <!-- Fecha de envio -->
            <span class="dim" style="font-size: var(--fs-xs);" th:text="${notif.fechaEnvio != null ? #temporals.format(notif.fechaEnvio, 'dd/MM/yyyy · HH:mm') : ''}">
                xx/xx/xxxx · xx:xx
            </span>
        </article>
    </div>
</th:block>

</body>
</html>
