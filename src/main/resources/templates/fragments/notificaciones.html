<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="lista(error, notificaciones)">
    <!-- Manejo de errores -->
    <div th:if="${error != null}" class="alert alert-danger" style="margin-bottom: 20px;">
        <p th:text="${error}">Mensaje de error</p>
    </div>

    <!-- Estado vacío -->
    <div th:if="${error == null and (notificaciones == null or notificaciones.isEmpty())}" class="empty-state card" style="margin-bottom: var(--sp-6);">
        <div class="empty-state__icon">🔔</div>
        <h3>No tienes notificaciones</h3>
        <p>Las actualizaciones sobre tus donaciones y logros aparecerán aquí.</p>
    </div>

    <!-- Lista de notificaciones -->
    <div th:if="${notificaciones != null and !notificaciones.isEmpty()}" class="grid" style="gap: var(--sp-3); margin-bottom: var(--sp-6);">
        <article th:each="notif : ${notificaciones}" class="card flex items-center gap-4">
            <!-- Icono dinámico según el medio de envío -->
            <div class="entity__icon" style="background: var(--primary-weak); color: var(--primary);" aria-hidden="true" th:text="${notif.medio == 'EMAIL' ? '✉️' : ((notif.medio == 'TELEFONO' || notif.medio == 'WHATSAPP') ? '📱' : '📦')}">📦</div>

            <div style="flex: 1;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                    <strong th:text="${notif.titulo}">Título Notificación</strong>
                    <!-- Badge mostrando el medio/canal de envío -->
                    <small class="muted"style="font-size: var(--fs-xs); background: #f0f0f0; padding: 2px 6px; border-radius: 4px;" th:if="${notif.medio != null}" th:text="${notif.medio}">EMAIL</small>
                </div>
                <p class="muted" style="font-size: var(--fs-sm); margin: 0 0 4px 0;" th:text="${notif.mensaje}">Mensaje descriptivo...</p>
                <!-- Fecha de envio -->
                <span class="dim" style="font-size: var(--fs-xs);" th:text="${notif.fechaEnvio != null ? #temporals.format(notif.fechaEnvio, 'dd/MM/yyyy · HH:mm') : ''}">
                    xx/xx/xxxx · xx:xx
                </span>
            </div>

            <span style="font-size: var(--fs-xs); padding: 4px 8px; border-radius: 12px; font-weight: bold;" th:classappend="${notif.estado == 'ENVIADA' ? 'alert-success' : 'alert-warning'}" th:text="${notif.estado}">ENVIADA</span>
        </article>
    </div>
</th:block>

</body>
</html>
