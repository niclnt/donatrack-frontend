<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Ingresar')}"></head>
<body>
<a class="skip-link" href="#main">Saltar al contenido</a>

<div class="page">
<header th:replace="~{fragments/base :: topbar('login')}"></header>

<main id="main" class="page-body">
  <div class="container" style="max-width: 440px;">
    <div class="card">
      <h1 style="font-size: var(--fs-xl); margin-bottom: var(--sp-2);">Bienvenido/a</h1>
      <p class="muted" style="margin-bottom: var(--sp-5);">Accedé para gestionar tus donaciones.</p>

      <div th:if="${param.error}" class="alert alert--error" role="alert">Correo o contraseña incorrectos.</div>
      <div th:if="${param.logout}" class="alert alert--success" role="status">Cerraste sesión correctamente.</div>
      <div th:if="${param.expired}" class="alert alert--info" role="status">Tu sesión expiró. Volvé a ingresar.</div>
      <div th:if="${param.unauthorized}" class="alert alert--info" role="status">Ingresá para continuar.</div>
      <div th:if="${mailRegistrado}" class="alert alert--success" role="status">¡Tu cuenta quedó creada! Ingresá con tu correo y contraseña.</div>

      <!-- th:action agrega el token CSRF automaticamente -->
      <form th:action="@{/login}" method="post" data-loading>
        <div class="field">
          <label class="field__label" for="username">Correo electrónico</label>
          <input class="input" id="username" name="username" type="email" placeholder="tu@correo.com" th:value="${mailRegistrado}"
                 autocomplete="email" required autofocus>
        </div>
        <div class="field">
          <label class="field__label" for="password">Contraseña</label>
          <input class="input" id="password" name="password" type="password" placeholder="••••••••"
                 autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Ingresar</button>
      </form>
      <p class="muted text-center" style="margin-top: var(--sp-5);">¿No tenés cuenta? <a th:href="@{/registro}">Creá una</a></p>
    </div>
  </div>
</main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
