<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Ingresar — DonaTrack')}"></head>
<body>
<header class="topbar">
    <a class="brand" href="index.html">◆ DonaTrack</a>
    <div class="topbar__actions" style="margin-left:auto;">
        <a class="btn btn--link btn--sm" href="index.html">← Volver al inicio</a>
    </div>
</header>
<main id="main" class="page-body">
    <div class="container" style="max-width: 440px;">
        <div class="card">
            <div class="filterbar" data-filter-group role="tablist" aria-label="Modo de acceso">
                <button class="filter-pill" aria-pressed="true">Iniciar sesión</button>
                <button class="filter-pill" aria-pressed="false" id="registro">Registrarme</button>
            </div>

            <!-- error si el login falla -->
            <div th:if="${error}" class="alert alert-danger" style="margin-bottom: 15px; color: red;">
                Credenciales inválidas. Por favor intente nuevamente.
            </div>

            <!-- Formulario POST apuntando a /login -->
            <form th:action="@{/login}" method="post" novalidate>
                <div class="field">
                    <label class="field__label" for="email">Correo electrónico</label>
                    <input class="input" id="email" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label class="field__label" for="pass">Contraseña</label>
                    <input class="input" id="pass" name="pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button class="btn btn--primary btn--block" type="submit">Ingresar</button>
            </form>
        </div>
    </div>
</main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
