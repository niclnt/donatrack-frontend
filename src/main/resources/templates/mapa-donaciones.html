<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa de Donaciones — DonaTrack</title>

    <link rel="stylesheet" th:href="@{/assets/css/styles.css}">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>
<a class="skip-link" href="#main">Saltar al contenido</a>

<div class="page">

    <header th:replace="~{fragments/base :: topbar('mapa-donaciones')}"></header>

    <main id="main" class="page-body">
        <div class="container">

            <h1>Mapa de donaciones realizadas</h1>
            <p class="muted">
                Explorá las donaciones entregadas a las entidades
                beneficiarias de DonaTrack.
            </p>
            <p class="muted"
               th:if="${errorMapa != null}"
               th:text="${errorMapa}">
            </p>

            <p class="muted"
               th:if="${errorMapa == null and #lists.isEmpty(donacionesEntregadas)}">
                Todavía no hay donaciones entregadas para mostrar.
            </p>

            <p class="muted"
               th:if="${errorMapa == null and not #lists.isEmpty(donacionesEntregadas)}"
               th:text="|Donaciones entregadas: ${#lists.size(donacionesEntregadas)}|">
            </p>
            <div id="mapa" style="height: 450px; margin-top: 24px;">
            </div>

            <!-- Fotos que cargaron las entidades al recibir las donaciones (públicas, sin login) -->
            <section id="fotos" class="mt-5" aria-labelledby="fotos-title"
                     th:with="conFotos=${donacionesEntregadas.?[fotos() != null and !fotos().isEmpty()]}">
                <h2 id="fotos-title">Fotos de las entregas</h2>
                <p class="muted" th:if="${#lists.isEmpty(conFotos)}">Todavía no hay fotos de entregas cargadas.</p>

                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 16px;">
                    <figure class="card" style="padding: 0; margin: 0; overflow: hidden;"
                            th:each="donacion : ${conFotos}">
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                            <a th:each="fotoId, it : ${donacion.fotos()}" th:href="@{/fotos/{id}(id=${fotoId})}"
                               target="_blank" rel="noopener" th:style="${it.first} ? 'flex: 1 1 100%;' : 'flex: 1 1 30%;'"
                               th:attr="aria-label=|Ver foto ${it.count} de la entrega a ${donacion.entidadBeneficiaria()}|">
                                <img th:src="@{/fotos/{id}(id=${fotoId})}" alt="" loading="lazy"
                                     th:style="${it.first} ? 'width: 100%; height: 160px; object-fit: cover; display: block;' : 'width: 100%; height: 60px; object-fit: cover; display: block;'">
                            </a>
                        </div>
                        <figcaption style="padding: 12px 16px;">
                            <strong th:text="${donacion.entidadBeneficiaria()}">Comedor</strong>
                            <p class="muted" style="margin: 4px 0 0; font-size: var(--fs-sm);"
                               th:text="|${#temporals.format(donacion.fechaEntrega(), 'dd/MM/yyyy')} · ${donacion.bienes() != null ? #strings.listJoin(donacion.bienes(), ', ') : ''}|">
                                17/10/2026 · Fideos
                            </p>
                        </figcaption>
                    </figure>
                </div>
            </section>

        </div>
    </main>

</div>

<script th:src="@{/assets/js/app.js}"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    window.donacionesEntregadas = /*[[${donacionesEntregadas}]]*/ [];
</script>
<script th:src="@{/assets/js/mapa-donaciones.js}"></script>
</body>
</html>
